<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="230" fill="#FB7185"/>

  <!-- Head -->
  <circle cx="512" cy="200" r="52" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/>

  <!-- Neck + spine -->
  <line x1="512" y1="252" x2="512" y2="420" stroke="#000" stroke-width="22" stroke-linecap="round"/>

  <!-- Left arm — extended low and back (spinning energy) -->
  <path d="M512 310 Q440 340 390 370" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/>

  <!-- Right arm — raised high in arabesque -->
  <path d="M512 310 Q590 260 650 210" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/>

  <!-- Tutu — layered skirt lines fanning from waist -->
  <path d="M380 415 Q512 460 644 415" fill="none" stroke="#000" stroke-width="20" stroke-linecap="round"/>
  <path d="M360 440 Q512 495 664 440" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round"/>
  <path d="M345 466 Q512 528 679 466" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>

  <!-- Standing leg — down, slightly angled, en pointe -->
  <line x1="510" y1="420" x2="490" y2="660" stroke="#000" stroke-width="22" stroke-linecap="round"/>
  <!-- Pointe foot -->
  <line x1="490" y1="660" x2="458" y2="672" stroke="#000" stroke-width="18" stroke-linecap="round"/>

  <!-- Extended leg — lifted back and up (arabesque) -->
  <path d="M510 420 Q600 520 660 560" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/>
  <!-- Extended foot pointed -->
  <line x1="660" y1="560" x2="690" y2="545" stroke="#000" stroke-width="16" stroke-linecap="round"/>
</svg>
